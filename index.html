<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小学语文（统编版）古诗词全表 · 112 首</title>
<style>
  :root {
    --ink: #2e2a23;
    --ink-soft: #6d6455;
    --ink-faint: #a2977f;
    --paper: #f4efe2;
    --card: #fffdf6;
    --line: #e3d9c1;
    --accent: #a83a2b;   /* 朱砂红 */
    --gold: #bfa05c;
    --c-wu: #b07a3c;     /* 五言 赭 */
    --c-qi: #3f7182;     /* 七言 青 */
    --c-ci: #7e5fa8;     /* 词 紫 */
    --c-yue: #5f8c58;    /* 乐府民歌 绿 */
    --c-si: #9a958c;     /* 四言 灰 */
    --shadow: 0 1px 2px rgba(70,58,34,.05), 0 6px 20px rgba(70,58,34,.07);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background-color: var(--paper);
    background-image:
      radial-gradient(1200px 500px at 15% -5%, rgba(196,168,116,.10), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, rgba(160,120,70,.08), transparent 55%),
      repeating-linear-gradient(0deg, rgba(120,100,70,.016) 0 1px, transparent 1px 3px);
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: rgba(168,58,43,.16); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #d7caab; border-radius: 6px; border: 2px solid var(--paper); }
  ::-webkit-scrollbar-thumb:hover { background: #c6b78f; }
  ::-webkit-scrollbar-track { background: transparent; }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 44px 24px 96px; }
  .wrap::before {
    content: ""; display: block; height: 4px; border-radius: 2px; margin-bottom: 40px;
    background: linear-gradient(90deg, transparent, var(--accent) 25%, var(--gold) 50%, var(--accent) 75%, transparent);
  }

  header { text-align: center; margin-bottom: 30px; }
  .seal {
    width: 46px; height: 46px; margin: 0 auto 16px;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
    font-size: 26px; line-height: 1;
    border-radius: 8px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.28), 0 3px 8px rgba(168,58,43,.28);
  }
  header h1 {
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif;
    font-size: 34px; font-weight: 700; margin: 0; letter-spacing: 4px; color: var(--ink);
  }
  .divider { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 18px auto 16px; }
  .divider::before, .divider::after { content: ""; width: 100px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--line)); }
  .divider::after { background: linear-gradient(90deg, var(--line), transparent); }
  .divider .diamond { color: var(--gold); font-size: 9px; line-height: 1; }
  header .sub { color: var(--ink-soft); font-size: 14px; letter-spacing: 1px; }
  header .src { font-size: 12px; color: var(--ink-faint); margin-top: 8px; }

  /* 统计卡片 */
  .stats { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-bottom: 24px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 15px 22px; min-width: 92px; text-align: center;
    box-shadow: var(--shadow); position: relative; overflow: hidden;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .stat-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
  .stat-card:hover { transform: translateY(-3px); box-shadow: 0 10px 26px rgba(70,58,34,.12); }
  .stat-card .num { font-size: 30px; font-weight: 700; font-family: Georgia, "Times New Roman", serif; line-height: 1.05; }
  .stat-card .lbl { font-size: 12px; color: var(--ink-soft); letter-spacing: 2px; margin-top: 3px; }
  .stat-card.cat-其他::before { background: var(--accent); }
  .stat-card.cat-五言::before { background: var(--c-wu); }
  .stat-card.cat-七言::before { background: var(--c-qi); }
  .stat-card.cat-词::before { background: var(--c-ci); }
  .stat-card.cat-乐府::before, .stat-card.cat-民歌::before { background: var(--c-yue); }
  .stat-card.cat-四言::before { background: var(--c-si); }
  .stat-card.cat-其他 .num { color: var(--accent); }
  .stat-card.cat-五言 .num { color: var(--c-wu); }
  .stat-card.cat-七言 .num { color: var(--c-qi); }
  .stat-card.cat-词 .num { color: var(--c-ci); }
  .stat-card.cat-乐府 .num, .stat-card.cat-民歌 .num { color: var(--c-yue); }
  .stat-card.cat-四言 .num { color: var(--c-si); }

  /* 分布元信息 */
  .meta {
    text-align: center; margin-bottom: 24px; padding: 16px 20px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  }
  .meta .row { margin: 6px 0; }
  .meta .label { font-size: 12px; color: var(--ink-faint); margin-right: 8px; letter-spacing: 1px; }
  .dyn-chip { display: inline-block; background: #f8f2e2; border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 14px; margin: 3px 4px; font-size: 13px; transition: border-color .15s ease; }
  .dyn-chip:hover { border-color: var(--c-qi); }
  .dyn-chip b { color: var(--c-qi); }
  .author-chip { display: inline-block; background: #f2ead6; border-radius: 999px;
    padding: 3px 12px; margin: 2px 3px; font-size: 12px; color: var(--ink-soft); }
  .author-chip em { font-style: normal; color: var(--accent); margin-left: 4px; font-weight: 700; }

  /* 工具栏 */
  .toolbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(244,239,226,.82);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    padding: 12px 0; border-bottom: 1px solid var(--line); margin-bottom: 18px;
  }
  .toolbar .inner { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  #search { flex: 1; min-width: 200px; padding: 9px 16px; border: 1px solid var(--line);
    border-radius: 999px; font-size: 14px; background: var(--card); color: var(--ink);
    transition: border-color .15s ease, box-shadow .15s ease; }
  #search::placeholder { color: var(--ink-faint); }
  #search:focus { outline: none; border-color: var(--c-qi); box-shadow: 0 0 0 3px rgba(63,113,130,.14); }
  .fbtn { padding: 8px 16px; border: 1px solid var(--line); background: var(--card);
    border-radius: 999px; cursor: pointer; font-size: 13px; color: var(--ink-soft);
    transition: all .15s ease; }
  .fbtn:hover { border-color: var(--gold); color: var(--ink); transform: translateY(-1px); }
  .fbtn.active { background: var(--ink); color: #fff; border-color: var(--ink); box-shadow: 0 4px 12px rgba(46,42,35,.22); }
  .count { font-size: 13px; color: var(--ink-soft); margin-left: auto; font-variant-numeric: tabular-nums; }

  /* 表格 */
  table { width: 100%; border-collapse: collapse; background: var(--card);
    border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
  thead th { background: #efe7d1; color: var(--ink); font-size: 13px; letter-spacing: 1px;
    padding: 13px 16px; text-align: left; }
  tbody tr { border-top: 1px solid var(--line); transition: background .12s ease; }
  tbody tr:not(.vol-sep):hover { background: #faf3e3; }
  td { padding: 10px 16px; font-size: 14px; vertical-align: middle; }
  td.idx { color: var(--ink-faint); width: 44px; text-align: center; font-size: 12px; font-variant-numeric: tabular-nums; }
  td.vol { width: 100px; color: var(--ink-soft); font-size: 13px; white-space: nowrap; }
  td.title { font-weight: 600; font-family: "Kaiti SC", "STKaiti", "KaiTi", serif; font-size: 15px; letter-spacing: .5px; }
  td.author { width: 120px; }
  td.dynasty { width: 70px; color: var(--ink-soft); }
  .badge { display: inline-block; padding: 3px 11px; border-radius: 999px; font-size: 12px;
    color: #fff; white-space: nowrap; letter-spacing: .5px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .b-五言 { background: var(--c-wu); }
  .b-七言 { background: var(--c-qi); }
  .b-词 { background: var(--c-ci); }
  .b-乐府, .b-民歌 { background: var(--c-yue); }
  .b-四言, .b-其他 { background: var(--c-si); }
  .vol-sep td { background: linear-gradient(90deg, #f4edd9, #fbf6e9, #f4edd9); color: var(--accent);
    font-weight: 700; font-size: 13px; padding: 10px 16px; letter-spacing: 2px; }
  .vol-sep td::before { content: "❖ "; font-size: 11px; color: var(--gold); }

  footer { text-align: center; color: var(--ink-faint); font-size: 12px; margin-top: 30px; line-height: 1.8; }
  .hidden { display: none !important; }

  @media (max-width: 720px) {
    .wrap { padding: 28px 14px 64px; }
    .wrap::before { margin-bottom: 28px; }
    header h1 { font-size: 27px; letter-spacing: 2px; }
    .stat-card { padding: 13px 16px; min-width: 80px; }
    .stat-card .num { font-size: 25px; }
    table { display: block; overflow-x: auto; white-space: nowrap; border-radius: 12px; }
    thead th { position: static; }
    .count { margin-left: 0; width: 100%; text-align: right; }
  }
  @media print {
    .toolbar, .seal, .wrap::before { display: none; }
    body { background: #fff; }
    .wrap { max-width: none; padding: 0; }
    table { box-shadow: none; border: 1px solid #ccc; border-radius: 0; }
    thead th { position: static; background: #eee; }
  }
</style>
</head>

    if (!matches(r)) continue;
    if (r.vol !== lastVol) {
      lastVol = r.vol;
      html += `<tr class="vol-sep"><td colspan="6">${r.vol}</td></tr>`;
    }
    html += `<tr>
      <td class="idx">${r.idx}</td>
      <td class="vol">${r.vol}</td>
      <td class="title">${r.title}</td>
      <td class="author">${r.author}</td>
      <td class="dynasty">${r.dynasty}</td>
      <td><span class="badge b-${r.cat}">${r.genre}</span></td>
    </tr>`;
    n++;
  }
  tbody.innerHTML = html;
  countEl.textContent = '显示 ' + n + ' / ' + RECORDS.length + ' 首';
}

btns.forEach(b => b.addEventListener('click', () => {
  btns.forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  curCat = b.dataset.cat;
  render();
}));

searchEl.addEventListener('input', () => {
  curQ = searchEl.value.trim();
  render();
});

render();
</script>
</body>
</html>
